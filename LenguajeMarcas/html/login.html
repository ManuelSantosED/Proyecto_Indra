    <link rel="stylesheet" href="../css/style.css"> <!-- Estilos globales -->
    <link rel="stylesheet" href="../css/login.css"> <!-- Estilos específicos -->
    <link rel="icon" href="../img/ODS.png"> <!-- Ícono del portal -->
</head>
<body>
    <!-- Cabecera -->
    <header>
        <h1>Iniciar Sesión</h1>
        <nav>
            <a href="../index.html">Inicio</a>
            <div class="menu-desplegable">
                <a href="eventos.html">Eventos</a>
                <div class="submenu">
                    <a href="actividades.html">Actividades</a>
                    <a href="talleres.html">Talleres</a>
                    <a href="conferencias.html">Conferencias</a>
                </div>

            <a href="sobrenosotros.html">Sobre Nosotros</a>
            <a href="inscripciones.html">Inscripciones</a>

            <a href="registro.html">Registrarse</a>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="main-login">
        <section class="login-form">
            <h2>Accede a tu cuenta</h2>
            <form action="procesar-login.php" method="post"> <!-- Formulario para procesar datos -->
                <!-- Campo Usuario -->
                <div class="campo">
                    <label for="usuario">Usuario o Correo Electrónico:</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Escribe tu usuario" required>
                </div>

                <!-- Campo Contraseña -->
                <div class="campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Escribe tu contraseña" required>
                </div>

                <!-- Botón de Inicio de Sesión -->
                <div class="campo">
                    <button type="submit">Iniciar Sesión</button>
                </div>

                <!-- Opciones Adicionales -->
                <div class="opciones">
                    <a href="recuperar-contrasena.html">¿Olvidaste tu contraseña?</a>
                    <span>|</span>
                    <a href="registro.html">Registrarse</a>
                </div>
            </form>
        </section>
    </main>

    <!-- Pie de Página -->
    <footer>
        <h3>Nuestras redes:</h3>
