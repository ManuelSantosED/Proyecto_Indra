<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Portal de Eventos Sostenibles</title>
    <link rel="stylesheet" href="../css/style.css"> <!-- Estilos comunes -->
    <link rel="stylesheet" href="../css/registro.css"> <!-- Estilos específicos -->
    <link rel="icon" href="../img/ODS.png"> <!-- Ícono del portal -->
</head>
<body>
    <!-- Cabecera -->
    <header>
        <h1>Registro</h1>
        <nav>
            <a href="../index.html">Inicio</a>
            <div class="menu-desplegable">
                <a href="eventos.html">Eventos</a>
                <div class="submenu">
                    <a href="actividades.html">Actividades</a>
                    <a href="talleres.html">Talleres</a>
                    <a href="conferencias.html">Conferencias</a>
                </div>
            </div>
            <a href="sobrenosotros.html">Sobre Nosotros</a>
            <a href="inscripciones.html">Inscripciones</a>
            <a href="login.html">Iniciar Sesión</a>
            <a class="actual-position" href="registro.html">Registrarse</a>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="main-registro">
        <section class="registro-form">
            <h2>Crea tu cuenta</h2>
            <form action="procesar-registro.php" method="post"> <!-- Formulario para procesar datos -->
                <!-- Campo Nombre -->
                <div class="campo">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre completo" required>
                </div>

                <!-- Campo Correo -->
                <div class="campo">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="Escribe tu correo electrónico" required>
                </div>

                <!-- Campo Contraseña -->
                <div class="campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
                </div>

                <!-- Confirmar Contraseña -->
                <div class="campo">
                    <label for="confirmar-password">Confirmar Contraseña:</label>
                    <input type="password" id="confirmar-password" name="confirmar-password" placeholder="Repite tu contraseña" required>
                </div>

                <!-- Botón de Registro -->
                <div class="campo">
                    <button type="submit">Registrarse</button>
                </div>

                <!-- Redirigir a Iniciar Sesión -->
                <div class="opciones">
                    <a href="login.html">¿Ya tienes una cuenta? Inicia sesión aquí</a>
                </div>
            </form>
        </section>
    </main>

    <!-- Pie de Página -->
    <footer>
        <h3>Nuestras redes:</h3>
        <img src="../img/LogoInstagram.jpeg" alt="Logo de Instagram" style="width:20px; height:20px;"> @SostenibilidadSantos |
        <img src="../img/LogoWhatsAap.png" alt="Logo de WhatsApp" style="width:20px; height:20px;"> 603783977
    </footer>
</body>
</html>
